<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vulnerability Classification System</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Century Gothic", Arial, sans-serif;
            background: #0b1220;
            color: white;
        }

        #message {
            max-width: 700px;
            padding: 40px;
            text-align: center;
            line-height: 1.7;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            opacity: .9;
        }
    </style>
</head>
<body>
    <div id="message">
        <h1 id="title">Password Vulnerability Classification System</h1>

        <p id="status">
            Starting system...
        </p>
    </div>

    <script>
        /* =========================================================
           LANGUAGE HELPER & TRANSLATIONS
           ========================================================= */
        function getCurrentLang() {
            return localStorage.getItem("app_lang") || "en";
        }

        function getTranslations(lang = "en") {
            if (lang === "tl") {
                return {
                    title: "Password Vulnerability Classification System",
                    starting: "Pagsisimula ng sistema...",
                    fileError: "<strong>Hindi masimulan ang proyekto.</strong><br><br>" +
                               "Ang sistemang ito ay kailangang buksan sa pamamagitan ng isang local web server.<br><br>" +
                               "Mangyaring patakbuhin ang proyekto mula sa Visual Studio Code o iba pang local server, pagkatapos ay buksan ang ibinigay na localhost address."
                };
            }

            return {
                title: "Password Vulnerability Classification System",
                starting: "Starting system...",
                fileError: "<strong>Project cannot start.</strong><br><br>" +
                           "This system must be opened through a local web server.<br><br>" +
                           "Please run the project from Visual Studio Code or another local server, then open the provided localhost address."
            };
        }

        const lang = getCurrentLang();
        const t = getTranslations(lang);

        document.getElementById("title").textContent = t.title;

        // SYSTEM STARTUP
        // Project opened directly from file explorer
        if (window.location.protocol === "file:") {
            document.getElementById("status").innerHTML = t.fileError;
        }

        // Project opened correctly
        else {
            document.getElementById("status").textContent = t.starting;
            window.location.replace("pages/consent.html");
        }
    </script>
</body>
</html>
