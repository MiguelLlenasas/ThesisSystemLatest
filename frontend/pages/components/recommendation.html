<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recommendation</title>

    <link rel="stylesheet" href="../../css/recommendation.css?v=4">

    <script src="../../js/recommendation.js?v=4" defer></script>
</head>

<body>

    <div class="recommendation-page">

        <section class="recommendation-section">

            <div class="section-title">
                <h2 data-lang-en="Security Recommendations" data-lang-tl="Mga Rekomendasyon sa Sekuridad">Security Recommendations</h2>
            </div>

            <div class="recommendation-card" id="recommendationCard">

                <!--
                    Recommendation items generated dynamically
                    by recommendation.js
                -->
                <div
                    class="recommendation-image-container"
                    id="recommendationImage">
                </div>

                <div
                    class="recommendation-content"
                    id="recommendationContent">
                </div>


                <!-- =================================================
                     USER'S CHOICE
                ================================================== -->

                <article class="recommendation-item user-choice-card">

                    <div class="recommendation-image-wrapper">

                        <img
                            class="recommendation-image"
                            src="../assets/images/User%27s%20Choice.jpg"
                            alt="User's Choice"
                        >

                    </div>

                    <p class="recommendation-text"
                       data-lang-en="Recommendations are optional. Users can choose whether to follow them."
                       data-lang-tl="Ang mga rekomendasyon ay opsyonal. Maaaring piliin ng mga user kung susundin ang mga ito o hindi.">
                        Recommendations are optional. Users can choose whether to follow them.
                    </p>

                </article>


                <!-- =================================================
                     CHANGE PASSWORD EVERY 6 MONTHS
                ================================================== -->

                <article class="recommendation-item change-password-card">

                    <div class="recommendation-image-wrapper">

                        <img
                            class="recommendation-image"
                            src="../assets/images/ChangePassword.jpg"
                            alt="Change Password Every 6 Months"
                        >

                    </div>

                    <p class="recommendation-text"
                       data-lang-en="Change your password every 6 months. Change it sooner if needed."
                       data-lang-tl="Palitan ang iyong password bawat 6 na buwan. Palitan ito nang mas maaga kung kinakailangan.">
                        Change your password every 6 months. Change it sooner if needed.
                    </p>

                </article>

            </div>

        </section>

    </div>

    <script>
        /* =========================================================
           LANGUAGE HELPER FOR RECOMMENDATION.HTML COMPONENTS
           ========================================================= */
        (function updateRecommendationLanguage() {
            const lang = localStorage.getItem("app_lang") || "en";
            document.querySelectorAll("[data-lang-en]").forEach(elem => {
                const text = elem.getAttribute(`data-lang-${lang}`);
                if (text) {
                    elem.textContent = text;
                }
            });
        })();
    </script>

</body>

</html>
