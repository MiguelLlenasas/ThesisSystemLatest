<div
    id="decisionTraversalCard"
    class="decision-traversal-card"
    hidden
>
    <div class="decision-traversal-card-content">

        <button
            type="button"
            id="decisionTraversalClose"
            class="decision-traversal-close"
            aria-label="Close"
        >
            ✕
        </button>

        <div class="decision-traversal-scroll-content">

            <h2 id="decisionTraversalTitle" data-lang-en="Detailed Decision Tree Traversal" data-lang-tl="Detalyadong Pagsusuri sa Decision Tree Path">
                Detailed Decision Tree Traversal
            </h2>

            <div
                id="decisionTraversalContent"
                class="decision-traversal-content"
            >
                <p>
                    <span data-lang-en="This space provides detailed information about the flow of the Decision Tree. Each shape and line contains an explanation of its role in the decision path."
                          data-lang-tl="Ang bahaging ito ay nagbibigay ng detalyadong impormasyon tungkol sa daloy ng Decision Tree. Ang bawat hugis at linya ay naglalaman ng paliwanag sa gawaing ginagampanan nito sa decision path.">
                        This space provides detailed information about the flow of the Decision Tree.
                        Each shape and line contains an explanation of its role in the decision path.
                    </span>
                    <span class="decision-traversal-instruction"
                          data-lang-en="Click any shape to view its explanation. Click the selected shape again to close the explanation."
                          data-lang-tl="I-click ang alinmang hugis upang makita ang paliwanag nito. I-click muli ang napiling hugis upang isara ang paliwanag.">
                        Click any shape to view its explanation. Click the selected shape again to close the explanation.
                    </span>
                </p>
            </div>

            <div class="decision-traversal-main">

                <aside
                    id="decisionTraversalLeftInfo"
                    class="decision-traversal-info-slot left"
                ></aside>

                <div
                    id="decisionTraversalTree"
                    class="decision-traversal-tree"
                ></div>

                <aside
                    id="decisionTraversalRightInfo"
                    class="decision-traversal-info-slot right"
                ></aside>

            </div>

        </div>

    </div>
</div>

<script>
    /* =========================================================
       LANGUAGE HELPER FOR DECISIONTRAVERSALCARD.HTML COMPONENTS
       ========================================================= */
    (function updateDecisionTraversalLanguage() {
        const lang = localStorage.getItem("app_lang") || "en";
        document.querySelectorAll("#decisionTraversalCard [data-lang-en]").forEach(elem => {
            const text = elem.getAttribute(`data-lang-${lang}`);
            if (text) {
                elem.textContent = text;
            }
        });
    })();
</script>
